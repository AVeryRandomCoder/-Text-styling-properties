<!DOCTYPE html>
<html>
    <head>
        <title>text-decoration</title>
        <style>
            H1 {
                text-align: center;
                text-decoration: overline;
                text-transform: capitalize;
            }

            H2 {
                text-align: center;
                text-decoration: line-through;
                text-transform: uppercase;
            }

            H3 {
                text-align: center;
                text-decoration: underline;
                text-transform: lowercase;
            }

            H4 {
                text-align: center;
                text-decoration: underline;
                text-transform: none;
            }
        </style>
    </head>
    <body>
        <h1>I feel so sigma</h1>
        <h2>I feel so skibidi</h2>
        <h3>I feel so rizz</h3>
        <h4>Codingal</h4>
    </body>
</html>
