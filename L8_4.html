<!DOCTYPE html>
<html>
    <head>
        <title>text-decoration</title>
        <style>
            * {
                text-align: center;
                font-family: 'Times New Roman', Times, serif;
            }

            #text {
                text-shadow: 2px 3px 1px red;
            }

            #box {
                box-shadow: 9px 9px 5px blueviolet;
            }

            #indent {
                text-indent: 100px;
                color: aquamarine;
            }
        </style>
    </head>
    <body>
        <h1 id="text"> We can use text-shadow to well, give shadow to the Text</h1>
        <h1 id="box">Or we use box-shadow to give a shadow to the element</h1>

        <div>
            <p>This is an example of a text-indent</p>
            <p id="indent">This is text-indent</p>
        </div>
    </body>
</html>
