<!DOCTYPE html>
<html>
    <head>
        <title>Transform</title>
        <style>
            div {
                width: 300px;
                height: 200px;
                background-color: crimson;
                border: 2px solid blue;
            }

            #myDiv {
                transform: rotate(180deg);
            }
        </style>
    </head>
    <body>
        <div>
            Codingal
        </div>
        <div id="myDiv">
            Codingal
        </div>
    </body>
</html>
